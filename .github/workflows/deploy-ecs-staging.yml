name: Build & Deploy to AWS ECS (Staging)

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Backend Image (staging)
        run: |
          IMAGE_NAME=${{ secrets.ECR_REPO_BACKEND }}
          IMAGE_TAG=stg-${GITHUB_SHA::8}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=${{ secrets.AWS_REGION }}
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${IMAGE_NAME}:${IMAGE_TAG}
          aws ecr create-repository --repository-name ${IMAGE_NAME} || true
          docker push ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${IMAGE_NAME}:${IMAGE_TAG}

      - name: Build and Push Frontend Image (staging)
        run: |
          cd frontend
          IMAGE_NAME=${{ secrets.ECR_REPO_FRONTEND }}
          IMAGE_TAG=stg-${GITHUB_SHA::8}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=${{ secrets.AWS_REGION }}
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${IMAGE_NAME}:${IMAGE_TAG}
          aws ecr create-repository --repository-name ${IMAGE_NAME} || true
          docker push ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${IMAGE_NAME}:${IMAGE_TAG}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq and curl
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Deploy to ECS staging
        env:
          CONTAINER_BACKEND_NAME: ${{ secrets.CONTAINER_BACKEND_NAME }}
          CONTAINER_FRONTEND_NAME: ${{ secrets.CONTAINER_FRONTEND_NAME }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=${{ secrets.AWS_REGION }}
          CLUSTER=${{ secrets.STAGING_ECS_CLUSTER }}
          SERVICE=${{ secrets.STAGING_ECS_SERVICE }}
          BACKEND_REPO=${{ secrets.ECR_REPO_BACKEND }}
          FRONTEND_REPO=${{ secrets.ECR_REPO_FRONTEND }}
          IMAGE_TAG=stg-${GITHUB_SHA::8}
          BACKEND_IMAGE=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
          FRONTEND_IMAGE=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${FRONTEND_REPO}:${IMAGE_TAG}
          chmod +x ./scripts/ecs-deploy.sh
          ./scripts/ecs-deploy.sh ${CLUSTER} ${SERVICE} ${BACKEND_IMAGE} ${CONTAINER_BACKEND_NAME:-web} ${FRONTEND_IMAGE} ${CONTAINER_FRONTEND_NAME:-frontend}

      - name: Wait for staging to settle
        run: sleep 10

      - name: Smoke test staging API
        run: |
          chmod +x ./scripts/ecs-smoke-test.sh
          ./scripts/ecs-smoke-test.sh ${STAGING_API_URL:-https://staging.example.com}/t/${{ secrets.STAGING_TENANT_SLUG }}/public/stock totalCars
