name: Package Frontend (Imbra ZIP)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  package-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build and export frontend
        run: npm run build --prefix frontend && npm run export --prefix frontend

      - name: Package frontend (Imbra-ready ZIP)
        run: npm run package:deploy:frontend -- --out frontend-deploy.zip

      - name: Show ZIP size
        run: ls -lh frontend-deploy.zip || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy
          path: frontend-deploy.zip
