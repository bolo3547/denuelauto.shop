name: Build and Deploy to Imbra

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: set-tag
        run: |
          short_tag=$(echo "$IMAGE_TAG" | cut -c1-8)
          echo "IMAGE_TAG=$short_tag" >> $GITHUB_ENV
          echo "IMAGE_TAG=$short_tag" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          TAG=${IMAGE_TAG}
          REPO=${DOCKERHUB_USERNAME}/denuel-auto-backend:$TAG
          echo "Building $REPO"
          docker build -f Dockerfile -t $REPO .
          docker push $REPO

      - name: Build & push frontend image
        run: |
          TAG=${IMAGE_TAG}
          REPO=${DOCKERHUB_USERNAME}/denuel-auto-frontend:$TAG
          cd frontend
          echo "Building $REPO"
          docker build -f Dockerfile -t $REPO .
          docker push $REPO

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Create SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Copy files to server
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.prod.yml ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/docker-compose.prod.yml
          if [ -f ./.env.production ]; then scp -i ~/.ssh/id_rsa ./.env.production ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/.env.production; fi

      - name: Deploy to server
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          TAG=${{ needs.build-and-push.outputs.image-tag }}
          echo "Setting remote IMAGE_TAG=${TAG} in environment file"
          ssh -i ~/.ssh/id_rsa ${REMOTE_USER}@${REMOTE_HOST} "mkdir -p ${REMOTE_PATH} && cd ${REMOTE_PATH} && printf 'IMAGE_TAG=${TAG}\n' >> .env.production || true"
          ssh -i ~/.ssh/id_rsa ${REMOTE_USER}@${REMOTE_HOST} "cd ${REMOTE_PATH} && docker compose --env-file .env.production -f docker-compose.prod.yml pull && docker compose --env-file .env.production -f docker-compose.prod.yml up -d && docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy --schema prisma/schema.prisma || true"
