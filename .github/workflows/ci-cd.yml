name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Run lint
        run: npm run lint || true

      - name: Run tests
        run: npm test || true
      - name: Build backend for verification
        run: npm run build || true
      - name: Build frontend for verification
        run: cd frontend && npm run build || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image (tag sha & latest)
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build -f Dockerfile -t $DOCKERHUB_USERNAME/denuel-auto-backend:${IMAGE_TAG} .
          docker tag $DOCKERHUB_USERNAME/denuel-auto-backend:${IMAGE_TAG} $DOCKERHUB_USERNAME/denuel-auto-backend:latest
          docker push $DOCKERHUB_USERNAME/denuel-auto-backend:${IMAGE_TAG}
          docker push $DOCKERHUB_USERNAME/denuel-auto-backend:latest

      - name: Build frontend image (tag sha & latest)
        run: |
          cd frontend
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build -f Dockerfile -t $DOCKERHUB_USERNAME/denuel-auto-frontend:${IMAGE_TAG} .
          docker tag $DOCKERHUB_USERNAME/denuel-auto-frontend:${IMAGE_TAG} $DOCKERHUB_USERNAME/denuel-auto-frontend:latest
          docker push $DOCKERHUB_USERNAME/denuel-auto-frontend:${IMAGE_TAG}
          docker push $DOCKERHUB_USERNAME/denuel-auto-frontend:latest
