name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/testdb
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build New folder TypeScript target
        run: npx tsc -p "New folder/tsconfig.build.json"
      - name: Apply Prisma migrations
        run: |
          # retry once in case DB isn't ready immediately
          npx prisma migrate deploy --schema prisma/schema.prisma || (sleep 10 && npx prisma migrate deploy --schema prisma/schema.prisma)
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Run backend tests
        run: npm test --silent
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm test --silent
